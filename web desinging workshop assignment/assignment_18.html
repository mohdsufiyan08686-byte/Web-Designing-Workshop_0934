<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ABC College Admission 2026</h1>
    <section aria-labelledby="courses-heading">
            <h2 id="courses-heading">Courses and Fees</h2>
            
            <table border="1" cellpadding="6" cellspacing="0" width="100%" style="border-collapse: collapse;">
                <caption>Available Courses</caption>
                <thead>
                    <tr style="background-color: #eeeeee;">
                        <th scope="col">Course</th>
                        <th scope="col">Seats</th>
                        <th scope="col">Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <br>
        <section aria-label="Student Application Form">
            <form action="apply.php" method="post">
                <fieldset>
                    <legend>Application Form</legend>
                    
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" size="35" required>
                    <br><br>
                    
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" size="35" required>
                    <br><br>
                    
                    <label for="course">Course:</label><br>
                    <select id="course" name="course" required>
                        <option value="B.Tech CSE" selected>B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>
                    <br><br>
                    
                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4" cols="60" minlength="20" required></textarea>
                    <br><br>
                    
                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>

    </main>
    <footer>
        &copy; 2026 ABC College</footer>
</body>
</html>
